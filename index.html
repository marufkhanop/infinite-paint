<body class="bg-[#121212] text-neutral-200">
<div id="app" data-panel="closed" class="fixed inset-0 overflow-hidden">
<div id="stage" class="absolute inset-0 bg-[#0d0d0d]">
<canvas id="scene"></canvas>
<canvas id="live"></canvas>
<div id="cursor"></div>
</div>
<header id="topbar" class="glass fixed z-40 left-2 right-2 md:left-3 md:right-3 h-11 rounded-2xl flex items-center gap-0.5 px-1.5">
<button id="btnImport" class="topbtn flex items-center gap-1.5" title="Import a photo or a project file"><span data-icon="upload"></span><span class="hidden sm:inline">Import</span></button>
<button class="topbtn flex items-center gap-1.5" data-menu="export" title="Export"><span data-icon="download"></span><span class="hidden sm:inline">Export</span></button>
<button class="ibtn sm" data-menu="more" data-icon="more" title="More"></button>
<div class="flex-1"></div>
<button id="btnUndo" class="ibtn sm" data-icon="undo" title="Undo (Ctrl+Z)"></button>
<button id="btnRedo" class="ibtn sm" data-icon="redo" title="Redo (Ctrl+Shift+Z)"></button>
<button id="btnPanel" class="ibtn sm" data-icon="sliders" title="Brush / Colour / Layers"></button>
</header>
<div id="menu" class="glass fixed z-50 rounded-2xl p-1 min-w-[12rem]"></div>
<nav id="dock" class="glass fixed z-30 flex gap-1 p-1.5 rounded-2xl bottom-3 left-1/2 -translate-x-1/2 md:bottom-auto md:left-3 md:top-1/2 md:-translate-y-1/2 md:translate-x-0 md:flex-col">
<button class="ibtn" data-tool="brush" data-icon="brush" title="Brush (B)"></button>
<button class="ibtn" data-tool="eraser" data-icon="eraser" title="Eraser (E)"></button>
<button class="ibtn" data-tool="liquify" data-icon="waves" title="Liquify (L)"></button>
<button class="ibtn" data-tool="select" data-icon="lasso" title="Lasso select (S)"></button>
<button class="ibtn" data-tool="eyedropper" data-icon="pipette" title="Eyedropper (I)"></button>
<button id="btnColorQuick" class="ibtn" title="Colour"><span id="quickColor" class="colorbtn"></span></button>
</nav>
<div id="selBar" class="glass fixed z-30 left-1/2 -translate-x-1/2 top-[6.2rem] md:top-[4.2rem] rounded-2xl p-1 gap-1">
<button id="selDelete" class="topbtn">Delete</button>
<button id="selDone" class="topbtn">Deselect</button>
</div>
<div id="status" class="glass fixed z-30 left-3 top-[3.75rem] md:top-auto md:bottom-3 rounded-2xl pl-3 pr-1 py-1 flex items-center gap-3 text-[11px] font-mono text-neutral-300 nosel">
<span id="stZoom">100%</span>
<span id="stLevel" class="text-sky-300">L0</span>
<span id="stRot"></span>
<span class="flex items-center">
<button id="btnZoomOut" class="ibtn sm" data-icon="minus" title="Zoom out (-)"></button>
<button id="btnZoomIn" class="ibtn sm" data-icon="plus" title="Zoom in (+)"></button>
<button id="btnHome" class="ibtn sm" data-icon="home" title="Reset view (0)"></button>
</span>
</div>
<aside id="panel" class="panel-closed glass fixed z-40 flex flex-col overflow-hidden inset-x-0 bottom-0 rounded-t-3xl max-md:h-[50vh] md:inset-x-auto md:right-3 md:top-[4.25rem] md:bottom-14 md:w-72 md:rounded-2xl">
<div class="flex items-center gap-1 p-2 border-b border-white/10">
<div class="flex-1 flex gap-1" role="tablist">
<button class="tabbtn" role="tab" data-tabbtn="brush">Brush</button>
<button class="tabbtn" role="tab" data-tabbtn="color">Color</button>
<button class="tabbtn" role="tab" data-tabbtn="layers">Layers</button>
</div>
<button id="btnClosePanel" class="ibtn sm" data-icon="x" title="Close"></button>
</div>
<div class="flex-1 overflow-y-auto p-3 nosel">
<section data-tab="brush" class="space-y-4">
<div id="grpBrushTypes">
<div class="grid grid-cols-2 gap-2">
<button class="chipbtn" data-brush="pen">Studio Pen</button>
<button class="chipbtn" data-brush="airbrush">Soft Airbrush</button>
<button class="chipbtn" data-brush="charcoal">Charcoal</button>
<button class="chipbtn" data-brush="ink">Calligraphy Ink</button>
</div>
</div>
<div id="grpLiquify" class="hidden">
<div id="liquifyModes" class="grid grid-cols-2 gap-2"></div>
</div>
<div>
<div class="flex justify-between"><span class="lbl" id="lblSize">Size</span><span class="val" id="valSize"></span></div>
<input id="rngSize" type="range" min="0" max="1000" step="1">
</div>
<div id="grpOpacity">
<div class="flex justify-between"><span class="lbl">Opacity</span><span class="val" id="valOpacity"></span></div>
<input id="rngOpacity" type="range" min="1" max="100" step="1">
</div>
<div id="grpStab">
<div class="flex justify-between"><span class="lbl">Stabilization</span><span class="val" id="valStab"></span></div>
<input id="rngStab" type="range" min="0" max="100" step="1">
</div>
<div id="grpStrength" class="hidden">
<div class="flex justify-between"><span class="lbl">Strength</span><span class="val" id="valStrength"></span></div>
<input id="rngStrength" type="range" min="5" max="100" step="1">
</div>
</section>
<section data-tab="color" class="space-y-3 hidden">
<canvas id="wheel" class="w-full aspect-square"></canvas>
<div class="flex gap-2 items-center">
<input id="hexIn" class="textin" maxlength="7" spellcheck="false" autocapitalize="off">
<span id="rgbRead" class="val whitespace-nowrap"></span>
</div>
<div class="flex justify-between items-center"><span class="lbl">Palette</span><span class="text-[10px] text-neutral-500">long-press / right-click to remove</span></div>
<div id="swatches"></div>
</section>
<section data-tab="layers" class="space-y-3 hidden">
<div class="flex items-center justify-between">
<button id="lyAdd" class="ibtn sm" data-icon="plus" title="Add layer"></button>
<button id="lyDup" class="ibtn sm" data-icon="copy" title="Duplicate"></button>
<button id="lyUp" class="ibtn sm" data-icon="up" title="Move up"></button>
<button id="lyDown" class="ibtn sm" data-icon="down" title="Move down"></button>
<button id="lyMerge" class="ibtn sm" data-icon="merge" title="Merge down"></button>
<button id="lyDel" class="ibtn sm" data-icon="trash" title="Delete"></button>
</div>
<div id="layerList" class="space-y-1.5"></div>
<div>
<div class="flex justify-between"><span class="lbl">Layer opacity</span><span class="val" id="valLyOpacity"></span></div>
<input id="lyOpacity" type="range" min="0" max="100" step="1">
</div>
</section>
</div>
</aside>
<div id="dlg"><div class="glass dlg-box"><p id="dlgMsg"></p><div class="dlg-btns"><button id="dlgNo" class="topbtn">Cancel</button><button id="dlgYes" class="topbtn dlg-yes">OK</button></div></div></div>
<div id="toast" class="glass"></div>
<input id="bgInput" type="color" class="hidden">
<input id="fileInput" type="file" accept="image/*,.json,application/json" class="hidden">
</div>
